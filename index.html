<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社内勉強会のお知らせ</title>
  <style>
    :root {
      --accent: #0f766e;
      --text: #0b1d2a;
      --muted: #5b6b7a;
      --bg: #f3f6f9;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans JP", "Helvetica", "Arial", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(960px, 100%);
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(15, 118, 110, 0.15);
      border: 1px solid rgba(15, 118, 110, 0.08);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .hero {
      position: relative;
      background: linear-gradient(120deg, rgba(15, 118, 110, 0.5), rgba(13, 148, 136, 0.25));
      min-height: 340px;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      mix-blend-mode: multiply;
      filter: saturate(1.05);
    }

    .info {
      padding: 24px 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .title {
      margin: 0;
      font-size: clamp(26px, 3vw, 32px);
      letter-spacing: 0.02em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 15px;
      color: var(--muted);
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(15, 118, 110, 0.15);
      border-radius: 12px;
      background: rgba(15, 118, 110, 0.04);
    }

    .meta svg {
      width: 18px;
      height: 18px;
      color: var(--accent);
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .info {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="hero">
      <img src="https://images.unsplash.com/photo-1556761175-129418cb2dfe?auto=format&fit=crop&w=1600&q=80" alt="勉強会のイメージ写真" loading="lazy" />
    </div>
    <section class="info">
      <h1 class="title">社内エンジニア勉強会 #12 — フロントエンド最新動向</h1>
      <div class="meta">
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 2v4M16 2v4M4.5 9h15M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z" />
            <path d="M9 13h6" />
            <path d="M9 17h3" />
          </svg>
          2024年11月22日（金） 18:30〜20:30
        </span>
        <span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 0 1 18 0Z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          5F カンファレンスルーム（オンライン配信あり）
        </span>
      </div>
      <p style="margin: 6px 0 0; color: var(--muted); line-height: 1.7; font-size: 15px;">
        チームを横断して知見を共有するための社内勉強会です。最新のUIフレームワークの動向や実践的な設計手法を紹介し、参加者同士で学び合う時間を用意しています。
      </p>
    </section>
  </article>
</body>
</html>
